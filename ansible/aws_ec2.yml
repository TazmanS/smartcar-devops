plugin: amazon.aws.aws_ec2

regions:
  - eu-central-1

filters:
  tag:Project: smartcar

keyed_groups:
  - key: tags.Role
    prefix: ""
    separator: ""

hostnames:
  - ip-address

compose:
  ansible_user: "'ubuntu'"
  ansible_ssh_private_key_file: "'~/.ssh/id_ed25519'"
  ansible_ssh_common_args: "'-o StrictHostKeyChecking=no'"
  private_ip: private_ip_address