---
- name: Install cert-manager
  hosts: control_plane
  become: true

  tasks:
    - name: Install cert-manager
      ansible.builtin.command:
        cmd: >
          kubectl apply
          -f https://github.com/cert-manager/cert-manager/releases/download/v1.18.2/cert-manager.yaml
      register: cert_manager_install
      changed_when: false