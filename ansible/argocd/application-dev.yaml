apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: smartcar-dev
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/TazmanS/smartcar-devops.git
    targetRevision: main
    path: kubernetes/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: smartcar-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true