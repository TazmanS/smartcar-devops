apiVersion: apps/v1
kind: Deployment

metadata:
  name: smartcar-postgres

spec:
  replicas: 1

  selector:
    matchLabels:
      app: smartcar-postgres

  template:
    metadata:
      labels:
        app: smartcar-postgres

    spec:
      containers:
        - name: smartcar-postgres
          image: postgres:17
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: smartcar

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DB_PASSWORD

          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc