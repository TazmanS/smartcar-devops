apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: smartcar-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - smartcar.shumilov.dev
      secretName: smartcar-tls

    - hosts:
        - stream.smartcar.shumilov.dev
      secretName: smartcar-stream-tls

    - hosts:
        - grafana.smartcar.shumilov.dev
      secretName: grafana-smartcar-tls
  rules:
    - host: smartcar.shumilov.dev
      http:
        paths:
          - path: /api
            pathType: Prefix
            
            backend:
              service:
                name: smartcar-backend
                port:
                  number: 8080

          - path: /swagger
            pathType: Prefix
            
            backend:
              service:
                name: smartcar-backend
                port:
                  number: 8080

          - path: /
            pathType: Prefix

            backend:
              service:
                name: smartcar-frontend
                port: 
                  number: 80

    - host: stream.smartcar.shumilov.dev
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: smartcar-backend
                port:
                  number: 8080

    - host: grafana.smartcar.shumilov.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 80